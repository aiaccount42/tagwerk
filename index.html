<body>
<style>
/* Layout: eine schmale Spalte (max 480px), iOS-Stil: große Titel, gruppierte Listen mit Haarlinien,
   Systemfarben, durchscheinende Tab-Leiste. Dunkel zuerst. */
:root {
  --bg: #000000;
  --surface: #1c1c1e;
  --surface2: #2c2c2e;
  --field: #2c2c2e;
  --panel: #1c1c1e;
  --line: rgba(84, 84, 88, 0.6);
  --line-strong: #48484a;
  --fg: #ffffff;
  --muted: #8e8e93;
  --accent: #30d158;
  --accent-fg: #000000;
  --accent-soft: rgba(48, 209, 88, 0.16);
  --danger: #ff453a;
  --bar: rgba(22, 22, 24, 0.78);
  --toast-bg: #3a3a3c;
  --toast-fg: #ffffff;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", system-ui, "Segoe UI", sans-serif;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f2f2f7; --surface: #ffffff; --surface2: #e9e9ee; --field: #ffffff; --panel: #f2f2f7;
    --line: rgba(60, 60, 67, 0.2); --line-strong: #c7c7cc; --fg: #000000; --muted: #6c6c70;
    --accent: #1f8a3b; --accent-fg: #ffffff; --accent-soft: rgba(31, 138, 59, 0.12); --danger: #d70015;
    --bar: rgba(249, 249, 249, 0.82); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f2f2f7; --surface: #ffffff; --surface2: #e9e9ee; --field: #ffffff; --panel: #f2f2f7;
  --line: rgba(60, 60, 67, 0.2); --line-strong: #c7c7cc; --fg: #000000; --muted: #6c6c70;
  --accent: #1f8a3b; --accent-fg: #ffffff; --accent-soft: rgba(31, 138, 59, 0.12); --danger: #d70015;
  --bar: rgba(249, 249, 249, 0.82); color-scheme: light;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--fg);
  font: 17px/1.35 var(--font); letter-spacing: -0.01em;
  padding-block: 12px 130px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent; -webkit-font-smoothing: antialiased;
}
button { font: inherit; letter-spacing: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 480px; margin: 0 auto; }
h1 { font: 700 34px/1.12 var(--font); margin: 2px 0 16px; letter-spacing: 0.01em; text-wrap: balance; }
h2 { font: 700 22px/1.2 var(--font); margin: 0 0 12px; text-wrap: balance; }
.date { margin: 0; color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: 0.02em; font-weight: 500; }
.daynote { margin: -8px 0 14px; color: var(--accent); font-weight: 600; font-size: 15px; }
.field { width: 100%; min-height: 48px; padding: 0 14px; border-radius: 12px; border: 0; background: var(--field); color: var(--fg); font: inherit; }
textarea.field { padding: 12px 14px; min-height: 150px; resize: vertical; line-height: 1.4; }
.field::placeholder { color: var(--muted); }

/* Statuskarte: Bauphase */
.status { padding: 20px; background: var(--surface); border-radius: 22px; }
.st-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.cap { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.stname { font: 800 32px/1.1 var(--font); margin-top: 4px; letter-spacing: 0.01em; overflow-wrap: anywhere; }
.stnum { flex: none; width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: var(--accent-fg); display: grid; place-items: center; font: 800 22px var(--font); font-variant-numeric: tabular-nums; }
.stnum.pop { animation: pop .7s ease-out; }
@keyframes pop { 0% { transform: scale(.6); } 55% { transform: scale(1.2); } 100% { transform: scale(1); } }
.rail { display: flex; gap: 3px; margin: 16px 0 18px; }
.rail i { flex: 1; height: 6px; border-radius: 3px; background: var(--surface2); }
.rail i.on { background: var(--accent); }
.rail i.cur { background: var(--accent); opacity: .55; }
.bars { display: flex; flex-direction: column; gap: 14px; }
.btxt { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
.btxt b { color: var(--fg); font-weight: 600; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 99px; background: var(--surface2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: inherit; transition: width .4s ease; }
.fastc { padding: 14px 18px; }
.reward { margin: 14px 0 0; font-size: 14px; color: var(--muted); }
.alldone { margin: 14px 4px 0; color: var(--accent); font-weight: 600; }
.weekline { margin: 14px 4px 0; font-size: 14px; color: var(--muted); }
.link { background: none; border: 0; padding: 4px 0 4px 6px; color: var(--accent); font-weight: 600; min-height: 32px; }
.paused { margin: 16px 4px 0; font-size: 14px; color: var(--muted); }

/* Karten */
.why { margin-top: 16px; padding: 18px; background: var(--surface); border-radius: 18px; }
.why h2 { font-size: 20px; margin: 0 0 4px; }
.why p { margin: 0 0 14px; color: var(--muted); font-size: 15px; }

/* Gruppierte Listen */
.slot, .sub { margin: 28px 16px 8px; font-size: 13px; letter-spacing: 0.02em; text-transform: uppercase; color: var(--muted); font-weight: 500; font-family: var(--font); }
.list { display: flex; flex-direction: column; background: var(--surface); border-radius: 14px; overflow: hidden; }
.habit { display: flex; align-items: center; gap: 12px; width: 100%; min-height: 64px; padding: 10px 16px; background: transparent; border: 0; border-bottom: .5px solid var(--line); border-radius: 0; text-align: left; color: var(--fg); }
.list > .habit:last-child { border-bottom: 0; }
.hmain { flex: 1; min-width: 0; display: flex; align-items: center; gap: 14px; min-height: 44px; padding: 0; border: 0; background: none; text-align: left; }
.hmain:active, .habit.edit:active { opacity: .6; }
.circle { flex: none; width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: grid; place-items: center; color: transparent; transition: background .15s, border-color .15s; }
.done .circle { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.half .circle { border-color: var(--accent); }
.half .circle::after { content: ""; width: 12px; height: 12px; border-radius: 50%; background: var(--accent); }
.half .circle svg { display: none; }
.circle svg { width: 16px; height: 16px; }
.hbody { flex: 1; min-width: 0; }
.hname { font-weight: 500; overflow-wrap: anywhere; }
.done .hname { color: var(--muted); }
.hmeta { font-size: 14px; color: var(--muted); margin-top: 1px; display: flex; align-items: center; gap: 2px 8px; flex-wrap: wrap; overflow-wrap: anywhere; }
.todo { display: flex; flex-direction: column; gap: 2px; margin-top: 6px; font-size: 14px; line-height: 1.35; color: var(--muted); text-align: left; }
.hmeta .lt { color: var(--accent); }
.hmeta .late { color: var(--danger); }
.segs { display: inline-flex; gap: 3px; }
.segs i { width: 14px; height: 5px; border-radius: 3px; background: var(--surface2); }
.segs i.on { background: var(--accent); }
.pts { flex: none; font-size: 14px; font-weight: 500; color: var(--muted); font-variant-numeric: tabular-nums; }
.done .pts, .half .pts { color: var(--accent); }
.mini { flex: none; min-height: 32px; padding: 0 12px; border-radius: 99px; border: 0; background: var(--surface2); font-size: 14px; font-weight: 600; }
.mini[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.stepper { flex: none; display: flex; align-items: center; gap: 4px; }
.step { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface2); font-size: 22px; line-height: 1; display: grid; place-items: center; }
.step.plus { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.step:disabled { opacity: .3; cursor: default; }
.cnt { min-width: 40px; text-align: center; font: 600 17px var(--font); font-variant-numeric: tabular-nums; }

.seg { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; padding: 2px; background: var(--surface2); border-radius: 12px; margin-top: 22px; }
.seg button { min-height: 48px; border: 0; border-radius: 10px; background: transparent; font-size: 14px; font-weight: 600; color: var(--muted); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 3px rgba(0, 0, 0, .25); }
.seg small { font-size: 11px; font-weight: 500; font-variant-numeric: tabular-nums; color: var(--muted); }
.seg small.ok { color: var(--accent); }
.empty { margin-top: 20px; padding: 24px 18px; background: var(--surface); border-radius: 18px; }
.empty p { margin: 0 0 16px; color: var(--muted); }
.btns { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { min-height: 50px; padding: 0 20px; border-radius: 14px; border: 0; background: var(--surface2); font-weight: 600; }
.btn.primary { background: var(--accent); color: var(--accent-fg); }
.btn.danger { color: var(--danger); }
.btn:disabled { opacity: .4; cursor: default; }
.btn:active { opacity: .7; }
.btn.block { width: 100%; margin-top: 12px; }

/* Verlauf */
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.fact { padding: 14px 12px; background: var(--surface); border-radius: 16px; min-width: 0; }
.fact b { display: block; font: 700 26px/1.1 var(--font); font-variant-numeric: tabular-nums; }
.fact span { font-size: 12px; color: var(--muted); }
.chart { display: flex; align-items: flex-end; gap: 4px; height: 150px; padding: 12px 12px 10px; background: var(--surface); border-radius: 16px; }
.col { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.col .v { font-size: 10px; color: var(--muted); font-variant-numeric: tabular-nums; height: 12px; }
.col .b { width: 100%; max-width: 20px; border-radius: 6px; background: var(--accent); opacity: .5; min-height: 3px; }
.col.today .b { opacity: 1; }
.col .d { font-size: 11px; color: var(--muted); }
.col.today .d { color: var(--fg); font-weight: 700; }
.subnote { margin: -2px 16px 10px; font-size: 14px; color: var(--muted); }
.rate { padding: 14px 16px; background: var(--surface); border-bottom: .5px solid var(--line); }
.list > .rate:last-child { border-bottom: 0; }
.rate .top { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
.rate .n { font-weight: 500; overflow-wrap: anywhere; }
.rate .p { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
.rate .bar { margin: 8px 0 6px; }
.rate .cnts { font-size: 14px; color: var(--muted); }
.rate .tip { margin-top: 6px; font-size: 15px; }
.rate .tip .btn { min-height: 38px; padding: 0 14px; margin-top: 8px; font-size: 15px; }
.review { margin-top: 14px; padding: 16px; border-radius: 16px; background: var(--surface); font-size: 15px; }
.review p { margin: 0 0 10px; }
.review .btn { min-height: 42px; font-size: 15px; }

/* Monatsansicht */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; padding: 12px; background: var(--surface); border-radius: 16px; }
.cal .wd { font-size: 11px; color: var(--muted); text-align: center; padding-bottom: 2px; }
.cell { position: relative; aspect-ratio: 1; border-radius: 8px; display: grid; place-items: center; font-size: 13px; font-variant-numeric: tabular-nums; background: var(--surface2); overflow: hidden; }
.cell::before { content: ""; position: absolute; inset: 0; background: var(--accent); opacity: var(--o, 0); }
.cell span { position: relative; }
.cell.hi span { color: var(--accent-fg); font-weight: 700; }
.cell.fut { opacity: .4; }
.cell.today { outline: 2px solid var(--fg); outline-offset: -2px; }
.cell.blank { background: none; }
.mnav { display: flex; align-items: center; justify-content: space-between; margin: 0 0 10px; }
.mnav b { font-weight: 600; }
.mnav button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--surface2); font-size: 20px; }
.mnav button:disabled { opacity: .3; cursor: default; }

/* Ziele */
.habit.edit { min-height: 64px; cursor: pointer; }
.chev { flex: none; color: var(--line-strong); font-size: 22px; }
.goal .bar { margin-top: 8px; }
.levels { margin: 0; padding: 0; list-style: none; background: var(--surface); border-radius: 14px; overflow: hidden; }
.levels li { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: .5px solid var(--line); font-variant-numeric: tabular-nums; }
.levels li:last-child { border-bottom: 0; }
.levels li span:last-child { color: var(--muted); text-align: right; overflow-wrap: anywhere; }
.levels li.got span { color: var(--accent); }
.levels li button { background: none; border: 0; color: var(--muted); min-width: 36px; min-height: 36px; font-size: 18px; }
.ladder { margin: 0; padding: 0; list-style: none; background: var(--surface); border-radius: 14px; overflow: hidden; }
.ladder li { display: flex; align-items: center; gap: 14px; padding: 10px 16px; min-height: 52px; border-bottom: .5px solid var(--line); }
.ladder li:last-child { border-bottom: 0; }
.ladder .no { flex: none; width: 30px; height: 30px; border-radius: 50%; background: var(--surface2); color: var(--muted); display: grid; place-items: center; font-size: 14px; font-weight: 700; }
.ladder .nm { flex: 1; min-width: 0; font-weight: 600; color: var(--muted); }
.ladder .pt { color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.ladder li.got .no { background: var(--accent-soft); color: var(--accent); }
.ladder li.got .nm { color: var(--fg); }
.ladder li.cur { background: var(--accent-soft); }
.ladder li.cur .no { background: var(--accent); color: var(--accent-fg); }
.ladder li.cur .nm { color: var(--fg); }
.addrow { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; align-items: stretch; }
.addrow .field { flex: 1 1 120px; width: auto; }
.addrow .field.narrow { flex: 0 0 90px; }
.lbl2 { display: flex; flex-direction: column; gap: 4px; flex: 1 1 140px; font-size: 13px; color: var(--muted); font-weight: 500; }
.note { margin: 24px 16px 0; font-size: 13px; color: var(--muted); }

/* Sheets */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 30; }
.panel { position: fixed; z-index: 31; left: 0; right: 0; bottom: 0; max-height: 92%; overflow-y: auto; background: var(--panel); border-radius: 22px 22px 0 0; padding: 22px max(16px, env(safe-area-inset-left, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)); }
.panel::before { content: ""; position: absolute; top: 8px; left: 50%; width: 36px; height: 5px; margin-left: -18px; border-radius: 3px; background: var(--line-strong); }
.panel .in { max-width: 480px; margin: 0 auto; padding-top: 6px; }
.lbl { margin: 20px 4px 8px; font-size: 13px; color: var(--muted); font-weight: 500; text-transform: uppercase; letter-spacing: .02em; display: block; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 42px; min-width: 48px; padding: 0 14px; border-radius: 12px; border: 0; background: var(--field); font-weight: 600; }
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.chip.wide { width: 100%; text-align: left; padding: 10px 14px; line-height: 1.35; font-weight: 500; }
.pick { display: flex; flex-direction: column; gap: 8px; }
.hint { font-size: 13px; color: var(--muted); margin: 6px 4px 0; }
.err { font-size: 14px; color: var(--danger); margin-top: 8px; }
.panel .stepper { gap: 10px; }
.panel .why, .panel .review { background: var(--field); }
.plan { list-style: none; margin: 12px 0; padding: 0; background: var(--field); border-radius: 14px; overflow: hidden; }
.plan li { padding: 12px 16px; border-bottom: .5px solid var(--line); display: flex; flex-direction: column; gap: 2px; }
.plan li:last-child { border-bottom: 0; }
.plan li b { font-weight: 600; }
.plan li span { color: var(--muted); font-size: 14px; }
.steprow { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
.steprow .field { flex: 1; }
.steprow .x { flex: none; width: 44px; height: 48px; border-radius: 12px; border: 0; background: var(--field); font-size: 18px; }
.steprow.dn .t { flex: 1; color: var(--muted); text-decoration: line-through; padding: 8px 4px; overflow-wrap: anywhere; }
.steprow.dn .x { width: auto; padding: 0 12px; font-size: 14px; font-weight: 600; }
.busy { margin: 14px 4px 4px; color: var(--muted); }

/* Navigation, Hinweis */
nav { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; background: var(--bar); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--line); padding: 6px max(16px, env(safe-area-inset-left, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)); }
nav .in { max-width: 480px; margin: 0 auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
nav button { min-height: 50px; border: 0; background: transparent; border-radius: 12px; color: var(--muted); font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
nav button svg { width: 25px; height: 25px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav button[aria-current="page"] { color: var(--accent); }
#toast { position: fixed; z-index: 40; left: 0; right: 0; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; pointer-events: none; padding: 0 16px; }
#toast span { background: var(--toast-bg); color: var(--toast-fg); font-weight: 600; font-size: 15px; padding: 12px 20px; border-radius: 99px; opacity: 0; transform: translateY(10px); transition: opacity .25s, transform .25s; text-align: center; max-width: 100%; overflow-wrap: anywhere; }
#toast.show span { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="wrap"><main id="app"></main></div>
<div id="toast" role="status" aria-live="polite"><span></span></div>
<div id="sheet"></div>
<input type="file" id="f-restore" accept="application/json,.json" hidden>
<nav aria-label="Bereiche"><div class="in">
  <button data-act="tab" data-tab="heute"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></svg>Heute</button>
  <button data-act="tab" data-tab="verlauf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-9M12 20V4M19 20v-6"/></svg>Verlauf</button>
  <button data-act="tab" data-tab="ziele"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4M6 5h11l-2 4 2 4H6"/></svg>Ziele</button>
</div></nav>

<script>
(function () {
  'use strict';
  var DAYS = [1, 2, 3, 4, 5, 6, 0];
  var DL = { 1: 'Mo', 2: 'Di', 3: 'Mi', 4: 'Do', 5: 'Fr', 6: 'Sa', 0: 'So' };
  var DLONG = { 1: 'Montag', 2: 'Dienstag', 3: 'Mittwoch', 4: 'Donnerstag', 5: 'Freitag', 6: 'Samstag', 0: 'Sonntag' };
  var MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  var SLOTS = [['morgens', 'Morgens'], ['mittags', 'Mittags'], ['abends', 'Abends'], ['any', 'Im Laufe des Tages']];
  var LS = 'tagwerk-v1', STEP_PTS = 20;
  var STAGES = ['Baugrube', 'Fundament', 'Rohbau', 'Dach', 'Fenster', 'Ausbau', 'Fertigstellung', 'Einzug', 'Anbau', 'Aufstockung'];
  var stage = function (L) { return L <= STAGES.length ? STAGES[L - 1] : 'Quartier'; };
  var MED = /tablett|medik|pille|insulin|arznei|spritze|tropfen|vitamin|supplement/i;

  function empty() { return { v: 1, base: 0, habits: [], log: {}, dismiss: {}, weeks: {}, goals: [], rewards: [], pause: null, fast: { on: false, steps: [] }, morning: null, coach: '', chaos: [], auto: {}, autoDay: '', gdismiss: {} }; }
  var S = empty();
  var ui = { tab: 'heute', sheet: null, goal: null, week: null, setup: null, reset: false, slot: '', pop: false, month: 0, review: null, restore: null };
  var ref = null, mode = 'local', status = 'ok';
  var saving = false, pending = false, timer = null, toastTimer = null;
  var samp = null, dl = null, ctl = null;

  var $ = function (s) { return document.querySelector(s); };
  var esc = function (s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };

  }
  function wakeStair() {

    var wake = Math.max(floorW, S.coach ? stairWake(key(d)) : floorW), free = leave - m.breakfast - wake - 10 - m.prep;

  /* Wochencheck: eine Gewohnheit über die letzten 7 Tage auswerten */
  function weekStats(h) {
    var now = new Date(), st = { tot: 0, full: 0, mini: 0, part: 0, miss: 0, got: 0 };
    for (var j = 0; j < 7; j++) {
      var d = addDays(now, -j); if (h.archived || h.grad || !schedDay(h, d)) continue;
      var k = key(d), t = tgt(h, k);
      st.tot++;
      var e = entry(h, k), n = e ? e[0] : 0;
      if (n === 0) { st.miss++; continue; }
      if (h.target === 1) { if (e[2] === 1) st.mini++; else st.full++; st.got += 1; }
      else { if (n >= t) st.full++; else st.part++; st.got += Math.min(n, t) / t; }
    }
    st.pc = st.tot ? Math.round(st.got / st.tot * 100) : 0;
    return st;
  }
  function weekTip(h, s) {
    if (s.tot < 3) return null;
    if (s.miss >= 3) return { t: 'Oft ausgelassen. Ändere Anker oder Größe, aber nur eins von beiden.', btn: true };
    if (h.target === 1 && s.mini > 0 && s.mini >= Math.ceil((s.full + s.mini) / 2)) return { t: 'Meist nur die Mindestversion. Passt die normale Version noch, oder soll sie kleiner werden?', btn: true };
    if (s.pc >= 90) return { t: 'Läuft stabil. Behalten und noch nicht erweitern.', btn: false };
    return null;
  }

  function viewMonth() {

  function setupSheetHTML(u) {

      : { id: null, name: '', pts: 10, noPts: false, target: 1, slot: 'any', days: [0, 1, 2, 3, 4, 5, 6], anchor: '', why: '', todo: '', grad: '', min: '', from: '', core: false, catchDay: -1 };

  /* Claude: Woche planen */
  var MEDHINT = 'Gewohnheiten, die Medikamente oder Tabletten betreffen, werden niemals pausiert oder verkleinert.';
  async function planWeek() {
    var w = ui.week; if (!samp || !w || !w.text.trim()) return;
    var days = weekDays(w.wk), today = key(new Date());
    var habits = S.habits.filter(function (h) { return !h.archived; }).map(function (h) {
      return { id: h.id, name: h.name, anker: h.anchor || '', mal_pro_tag: h.target, wochentage: h.days.map(function (d) { return DL[d]; }), mindestversion: h.min || '' };
    });
    var prompt = 'Du planst eine Woche für eine persönliche Gewohnheiten-App. Der Nutzer erzählt (vermutlich diktiert, mit Füllwörtern und Tippfehlern) von seiner Woche. Heute ist ' + today + '.\n\n' +
      'Tage der Woche:\n' + days.map(function (d) { return DLONG[d.getDay()] + ' = ' + key(d); }).join('\n') + '\n\n' +
      'Gewohnheiten (JSON):\n' + JSON.stringify(habits) + '\n\n' +
      'Text des Nutzers:\n"""' + w.text.slice(0, 4000) + '"""\n\n' +
      'Regeln: Routinen bleiben unverändert, außer der Text nennt einen Grund. Pro Tag und Gewohnheit gibt es zwei mögliche Anpassungen: "off" (entfällt an dem Tag, z. B. Urlaub, Reise, ganztägiger Termin zur Zeit des Ankers) und "light" (nur Mindestversion bzw. halbe Anzahl, z. B. sehr langer Arbeitstag). Im Zweifel light statt off. ' + MEDHINT + ' Löse Wochentage im Text mit den oben gelisteten Daten auf. "note" ist eine Kurznotiz zum Tag (höchstens 40 Zeichen, z. B. "Dienstreise"). Nimm nur Tage auf, an denen sich etwas ändert oder eine Notiz sinnvoll ist. Nutze ausschließlich die oben genannten ids. Keine Ratschläge, nur Planung. "summary" ist ein Satz auf Deutsch über die Woche.\n\n' +
      'Antworte nur mit JSON in dieser Form: {"summary":"...","days":[{"date":"YYYY-MM-DD","note":"","off":["id"],"light":["id"]}]}';
    ctl = new AbortController(); w.state = 'busy'; w.err = ''; renderSheet();
    try {
      var r = await samp.json(prompt, { signal: ctl.signal, cache: false });
      w.result = cleanWeek(r, w.wk); w.state = 'result';
    } catch (e) { w.state = 'input'; w.err = samErr(e); }
    ctl = null;
    if (ui.week === w) renderSheet();
  }
  function cleanWeek(r, wk) {
    var keys = {}; weekDays(wk).forEach(function (d) { keys[key(d)] = true; });
    var known = {}, prot = {};
    S.habits.filter(function (h) { return !h.archived; }).forEach(function (h) { known[h.id] = true; if (MED.test(h.name)) prot[h.id] = true; });
    var adj = {}, stripped = false;
    var pick = function (list) {
      var out = [];
      (Array.isArray(list) ? list : []).forEach(function (id) { id = String(id); if (!known[id]) return; if (prot[id]) { stripped = true; return; } if (out.indexOf(id) < 0) out.push(id); });
      return out;
    };
    ((r && Array.isArray(r.days)) ? r.days : []).forEach(function (x) {
      if (!x || !keys[x.date]) return;
      var o = pick(x.off), l = pick(x.light).filter(function (id) { return o.indexOf(id) < 0; });
      var note = String(x.note || '').slice(0, 60);
      if (o.length || l.length || note) adj[x.date] = { off: o, light: l, note: note };
    });
    return { summary: String((r && r.summary) || '').slice(0, 300), adj: adj, stripped: stripped };
  }

  /* Claude: Wochenrückblick */
  async function runReview() {
    if (!samp) return;
    var stats = S.habits.filter(function (h) { return !h.archived; }).map(function (h) {
      var s = weekStats(h);
      return { id: h.id, name: h.name, geplant: s.tot, normal: s.full, mini: s.mini, teilweise: s.part, ausgelassen: s.miss, anker: h.anchor || '', mindestversion: h.min || '' };
    });
    var prompt = 'Du wertest die letzten 7 Tage einer Gewohnheiten-App aus. Daten (JSON):\n' + JSON.stringify(stats) + '\n\n' +
      'Aufgabe: Nenne in einem bis zwei Sätzen sachlich, was auffällt. Schlage dann genau eine Änderung für nächste Woche vor, bei einer Gewohnheit (Anker, Größe, Mindestversion oder Tage). Sei direkt, ohne Lob um des Lobes willen. Läuft alles stabil, lautet die Änderung: behalten, nichts erweitern. ' + MEDHINT + ' Keine medizinischen Ratschläge.\n\n' +
      'Antworte nur mit JSON: {"summary":"...","change":"...","id":"id der betroffenen Gewohnheit oder leer"}';
    ui.review = { state: 'busy' }; render();
    try {
      var r = await samp.json(prompt, { cache: false });
      var id = String((r && r.id) || ''); if (!S.habits.some(function (h) { return h.id === id && !h.archived; })) id = '';
      ui.review = { state: 'ok', summary: String((r && r.summary) || '').slice(0, 500), change: String((r && r.change) || '').slice(0, 400), id: id };
    } catch (e) { ui.review = { state: 'err', msg: samErr(e) || 'Abgebrochen.' }; }
    render();
  }

  /* Claude: Ziel in einen Plan übersetzen */
  async function planGoal() {
    var g = ui.goal; if (!samp || !g || !g.title.trim()) return;
    var today = key(new Date());
    var prompt = 'Du hilfst einer Person, ein Ziel in einen machbaren Weg zu übersetzen. Heute ist ' + today + '.\n\n' +
      'Ziel: ' + g.title + '\nTermin: ' + (g.due || 'keiner genannt') + '\nAusgangslage: ' + (g.start || 'nicht genannt') + '\n' +
      'Bereits vorhandene Gewohnheiten (nicht doppeln): ' + (S.habits.filter(function (h) { return !h.archived; }).map(function (h) { return h.name; }).join(', ') || 'keine') + '\n\n' +
      'Liefere 3 bis 6 Etappen: konkrete, überprüfbare Meilensteine in zeitlicher Reihenfolge, jeweils mit Datum zwischen heute und dem Termin (ohne Termin: sinnvolle Abstände). Liefere außerdem 1 bis 3 Gewohnheiten, die das Ziel tragen; die erste ist die wichtigste. Jede Gewohnheit: name (kurz), anchor (eine feste Situation, an die sie gekoppelt ist, z. B. "nach dem Frühstück"), min (Mindestversion für schlechte Tage, kurz), target (meist 1), days (Wochentage als Zahlen 0=Sonntag bis 6=Samstag), pts (5, 10, 15 oder 20 je nach Aufwand), slot (morgens, mittags, abends oder any). Beginne klein; lieber zu leicht als zu schwer. assumptions: bis zu 3 kurze Annahmen, die du über die Person getroffen hast. Bei Gesundheitszielen nur Verhaltensplanung, keine medizinischen, finanziellen oder rechtlichen Ratschläge.\n\n' +
      'Antworte nur mit JSON: {"assumptions":["..."],"steps":[{"text":"...","due":"YYYY-MM-DD"}],"habits":[{"name":"...","anchor":"...","min":"...","target":1,"days":[0,1,2,3,4,5,6],"pts":10,"slot":"any"}]}';
